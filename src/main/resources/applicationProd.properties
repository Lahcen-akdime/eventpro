# Chargé quand SPRING_PROFILES_ACTIVE=prod (c'est le cas dans docker-compose.yml)

spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}

# --- Arrêt propre : les requêtes en cours se terminent avant l'arrêt ---
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# --- Session HTTP (la connexion utilise HttpSession) ---
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
# true derrière HTTPS (le navigateur n'envoie alors le cookie qu'en connexion chiffrée)
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}

# --- Actuator : seul /actuator/health est exposé, sans détails ---
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# --- Swagger : désactivé par défaut hors développement ---
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}