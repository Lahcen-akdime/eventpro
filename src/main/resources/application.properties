spring.application.name=api

# --- Base de données : tout vient de l'environnement. AUCUN mot de passe dans ce fichier. ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/eventpro}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
# Au bout de 3 s sans obtenir un verrou (SELECT ... FOR UPDATE), PostgreSQL renvoie une erreur
# au lieu d'attendre indéfiniment. (Hibernate ignore le délai de @QueryHints avec PostgreSQL.)
spring.datasource.hikari.connection-init-sql=SET lock_timeout = '3s'

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.open-in-view=false

# --- Compte administrateur initial ---
eventPro.admin.name=${ADMIN_NAME}
eventPro.admin.email=${ADMIN_EMAIL}
eventPro.admin.password=${ADMIN_PASSWORD}

# --- Réservation ---
eventpro.reservation.hold-duration=${RESERVATION_HOLD_DURATION:PT10M}